<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Бронь подтверждена — Туленранта</title>
    <meta name="description" content="Бронь создана. Откройте личный кабинет в Telegram-боте Туленранта." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500;600&display=swap"

  <body data-page="success">
    <main>
      <section class="page-hero">
        <div class="container">
          <div class="success-card reveal" data-success>
            <p class="eyebrow" style="justify-content: center">Готово</p>
            <h1 class="display" style="font-size: clamp(2.2rem, 5vw, 3.2rem)">Бронь создана</h1>
            <p class="lead" style="margin-inline: auto">Сохраните код и откройте личный кабинет в Telegram.</p>
            <div class="success-code" data-code>TLR-XXXX</div>
            <div class="summary-box" data-details style="text-align: left"></div>
            <a class="btn btn-primary" data-tg-link href="https://t.me/TulenrantaBot" target="_blank" rel="noopener">
              Открыть ЛК в Telegram
            </a>
            <p style="color: var(--text-soft); font-size: 0.85rem" data-tg-hint></p>
            <p style="color: var(--text-soft); font-size: 0.85rem">
              Бот пока заглушка (этап 2). Контракт deep-link уже готов:
              <code>start=booking_&lt;code&gt;</code>
            </p>
            <a class="btn btn-glass" href="./index.html">На главную</a>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
